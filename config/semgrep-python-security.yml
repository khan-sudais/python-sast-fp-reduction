rules:
  - id: python.security.exec
    message: Use of exec() can execute dynamically supplied code.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-95
      category: security
    pattern: exec(...)

  - id: python.security.eval
    message: Use of eval() can evaluate untrusted expressions.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-95
      category: security
    pattern: eval(...)

  - id: python.security.hardcoded-temp-path
    message: Hard-coded temporary filesystem path detected.
    severity: WARNING
    languages:
      - python
    metadata:
      cwe: CWE-377
      category: security
    pattern-regex: '["''](?:/tmp|/var/tmp|/dev/shm)(?:/[^"'']*)?["'']'

  - id: python.security.unsafe-deserialization
    message: Potentially unsafe Python object deserialization detected.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-502
      category: security
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: dill.load(...)
      - pattern: dill.loads(...)
      - pattern: shelve.open(...)

  - id: python.security.weak-hash
    message: Weak MD5 or SHA1 hash construction detected.
    severity: WARNING
    languages:
      - python
    metadata:
      cwe: CWE-327
      category: security
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new("md5", ..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new("sha1", ..., usedforsecurity=False, ...)

  - id: python.security.disabled-cert-validation
    message: TLS certificate verification is explicitly disabled.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-295
      category: security
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)

  - id: python.security.subprocess-shell-true
    message: Subprocess execution with shell=True can enable command injection.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-78
      category: security
    pattern-either:
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python.security.subprocess-execution
    message: Subprocess execution should be reviewed for untrusted input.
    severity: WARNING
    languages:
      - python
    metadata:
      cwe: CWE-78
      category: security
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.run(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
      - pattern-not: subprocess.Popen(..., shell=True, ...)
      - pattern-not: subprocess.call(..., shell=True, ...)
      - pattern-not: subprocess.run(..., shell=True, ...)
      - pattern-not: subprocess.check_call(..., shell=True, ...)
      - pattern-not: subprocess.check_output(..., shell=True, ...)

  - id: python.security.dynamic-sql
    message: Dynamically constructed SQL passed to a database execution call.
    severity: ERROR
    languages:
      - python
    metadata:
      cwe: CWE-89
      category: security
    pattern-either:
      - pattern: $CURSOR.execute(f"...{$VALUE}...")
      - pattern: $CURSOR.executemany(f"...{$VALUE}...", ...)
      - pattern: $CURSOR.execute($QUERY % $VALUE)
      - pattern: $CURSOR.executemany($QUERY % $VALUE, ...)
      - pattern: $CURSOR.execute($LEFT + $RIGHT)
      - pattern: $CURSOR.executemany($LEFT + $RIGHT, ...)
      - pattern: $CURSOR.execute($QUERY.format(...))
      - pattern: $CURSOR.executemany($QUERY.format(...), ...)
